{% set name = "svmbir" %}
{% set version = "0.4.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 64f6d70f939396157a49ecdbd8cd728496d7d5f0cd0894915c7c0ce8cf866357

build:
  number: 4
  # py>=314: the 0.4.0 setup.py uses ast.Constant.s, removed in Python 3.14.
  # Drop this skip at the next svmbir release.
  skip: true  # [win or py<39 or py>=314]
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    # Cross-compiling (osx-arm64 on the osx-64 runner) needs the build
    # platform's python and the packages the build step imports.
    - python                              # [build_platform != target_platform]
    - cross-python_{{ target_platform }}  # [build_platform != target_platform]
    - cython                              # [build_platform != target_platform]
    - numpy                               # [build_platform != target_platform]
  host:
    - cython
    - pip
    - python
    - setuptools
    - numpy >=1.26.3
    - llvm-openmp  # [osx]
    - libgomp  # [linux]
  run:
    - llvm-openmp  # [osx]
    - pillow
    - psutil >=5.8
    - python
    - numpy >=1.26.0

test:
  imports:
    - svmbir
  commands:
    - pip check
    - pytest
  requires:
    - pip
    - pytest
  source_files:
    - svmbir/tests/*

about:
  home: https://github.com/cabouman/svmbir
  summary: Python code for fast MBIR (Model Based Iterative Reconstruction)
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - bwohlberg
    - sjkisner
    - gbuzzard
    - cabouman
